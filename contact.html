<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ian Heggem</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/cybersecurity-portfolio.ico" type="images/x-icon">
</head>

<body>

    <header>
        <div class="header-overlay">
            <nav>
                <b>
                    <a href="index.html">Home</a>
                    &nbsp;
                    <a href="about.html">About Me</a>
                    &nbsp;
                    <a href="projects.html">Projects</a>
                    &nbsp;
                    <a href="skills.html">Skills & Certifications</a>
                    &nbsp;
                    <a href="experience.html">Experience</a>
                    &nbsp;
                    <a href="hobbies.html">Hobbies</a>
                    &nbsp;
                    <a href="contact.html">Contact</a>
                </b>
            </nav>
        </div>
    </header>

    <div id="error-overlay" style="display:none;">
        <div id="error-popup">
            <div id="error-icon">⚠️</div>
            <div id="error-title">Error</div>
            <div id="error-message">Please fill out all required fields.</div>
            <button id="error-close" onclick="document.getElementById('error-overlay').style.display='none'">OK</button>
        </div>
    </div>

    <main class="contact-main">
        <h2>Contact Me</h2>

        <div class="contact-info-cards">
            <div class="contact-info-card">
                <div class="contact-info-icon">📍</div>
                <div class="contact-info-label">Location</div>
                <div class="contact-info-value">Pooler, GA</div>
            </div>
            <div class="contact-info-card">
                <div class="contact-info-icon">🎓</div>
                <div class="contact-info-label">University</div>
                <div class="contact-info-value">Georgia Southern</div>
            </div>
            <div class="contact-info-card">
                <div class="contact-info-icon">📸</div>
                <div class="contact-info-label">Instagram</div>
                <div class="contact-info-value">
                    <a href="https://www.instagram.com/ian.h.mx5/" class="links" target="_blank">@ian.h.mx5</a>
                </div>
            </div>
        </div>

        <form id="contact-form" action="https://formspree.io/f/xreorpbq" method="POST">
            <div>
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div>
                <label for="subject">Subject</label><br>
                <input type="text" id="subject" name="subject" placeholder="What's this about?">
            </div>
            <div>
                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>

    </main>

    <footer>
        <div>
            <ul>
                <li><a href="projects.html" class="links">Projects</a></li>
                <li><a href="https://www.linkedin.com/in/ian-heggem-25889b337/" class="links" target="_blank">LinkedIn</a></li>
            </ul>
            &copy; Ian Heggem 2026
        </div>
    </footer>

    <script>
        const navLinks = document.querySelectorAll("nav a");
        const current = location.pathname.split("/").pop() || "index.html";
        navLinks.forEach(link => {
            if (link.getAttribute("href") === current) {
                link.classList.add("nav-active");
            }
        });

        document.getElementById("contact-form").addEventListener("submit", function(e) {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();
            if (!name || !email || !message) {
                e.preventDefault();
                document.getElementById("error-overlay").style.display = "flex";
            }
        });

        document.getElementById("error-overlay").addEventListener("click", function(e) {
            if (e.target === this) this.style.display = "none";
        });
    </script>
</body>
</html>
